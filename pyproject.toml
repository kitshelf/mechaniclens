[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mechaniclens"
version = "0.1.0"
description = "A Markdown-only kit that reads a repair estimate back to you — every line labeled Standard / Check / Question this, with the questions to ask at the counter. Never a price guess."
readme = "PKG-README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Debashish Ghosal" }]
keywords = ["repair", "estimate", "consumer", "ai-kit", "markdown", "mechanic"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Documentation",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
# The gauntlet tooling: run fixtures against a model, validate the runs.
tools = []

[project.urls]
Homepage = "https://github.com/kitshelf/mechaniclens"
Changelog = "https://github.com/kitshelf/mechaniclens/blob/main/CHANGELOG.md"
Releases = "https://github.com/kitshelf/mechaniclens/releases"
Issues = "https://github.com/kitshelf/mechaniclens/issues"

[project.scripts]
mechaniclens = "mechaniclens.cli:main"

[tool.setuptools]
packages = ["mechaniclens"]

[tool.setuptools.package-data]
mechaniclens = ["kit/**/*.md", "kit/**/*.py"]
